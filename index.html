<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Page</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg), #1e1b4b);
    color: var(--text);
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2.5rem 3rem;
    max-width: 480px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    text-align: center;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 2rem;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
  }
  button {
    margin-top: 1.5rem;
    padding: 0.7rem 1.6rem;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: translateY(-2px); }
  #count { font-weight: 700; color: var(--accent); }
  #status {
    margin-top: 1.25rem;
    font-size: 0.85rem;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    background: rgba(148, 163, 184, 0.1);
  }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>이것은 GitHub에 올릴 샘플 HTML 페이지입니다.</p>
    <p>버튼을 <span id="count">0</span>번 눌렀습니다.</p>
    <button onclick="document.getElementById('count').textContent = Number(document.getElementById('count').textContent) + 1">
      클릭해보세요
    </button>
    <div id="status">Supabase 연결 확인 중...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://yxcqteepjhayqwxemznf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_P6GsvhTOlKVCmPlKCL35YA_s2q6HTNT";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const statusEl = document.getElementById('status');

    (async () => {
      try {
        const { error } = await supabase.auth.getSession();
        if (error) throw error;
        statusEl.textContent = "Supabase 연결 성공 ✔";
        statusEl.classList.add('ok');
      } catch (err) {
        statusEl.textContent = "Supabase 연결 실패: " + err.message;
        statusEl.classList.add('err');
      }
    })();
  </script>
</body>
</html>
