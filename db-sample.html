<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB Storage Sample</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg), #1e1b4b);
    color: var(--text);
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2.5rem;
    width: 420px;
    max-width: 90vw;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.6rem;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }
  p.desc {
    color: var(--muted);
    text-align: center;
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
  }
  .input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  input:disabled, button:disabled { opacity: 0.5; cursor: not-allowed; }
  button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: transform 0.15s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button.clear-btn {
    width: 100%;
    margin-top: 1rem;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 260px;
    overflow-y: auto;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(148, 163, 184, 0.08);
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }
  li .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 0 0.3rem;
  }
  li .del-btn:hover { color: var(--danger); }
  .empty {
    color: var(--muted);
    text-align: center;
    font-size: 0.85rem;
    padding: 1rem 0;
  }
  .meta {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
  #status {
    margin-top: 1rem;
    font-size: 0.8rem;
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
    background: rgba(148, 163, 184, 0.1);
    text-align: center;
  }
  #status.ok { color: #4ade80; }
  #status.err { color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <h1>DB 저장 메모</h1>
    <p class="desc">Supabase 데이터베이스에 저장되며, 다른 기기에서도 동일한 데이터를 볼 수 있습니다.</p>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="메모를 입력하세요" maxlength="200" disabled>
      <button id="addBtn" disabled>추가</button>
    </div>

    <ul id="itemList"></ul>
    <div class="meta" id="metaInfo"></div>
    <div id="status">Supabase 연결 확인 중...</div>

    <button class="clear-btn" id="clearBtn" disabled>전체 삭제</button>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const TABLE = "notes";

    const input = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('itemList');
    const clearBtn = document.getElementById('clearBtn');
    const metaInfo = document.getElementById('metaInfo');
    const statusEl = document.getElementById('status');

    let supabaseClient = null;

    function setEnabled(enabled) {
      input.disabled = !enabled;
      addBtn.disabled = !enabled;
      clearBtn.disabled = !enabled;
    }

    function showError(message) {
      statusEl.textContent = message;
      statusEl.className = 'err';
    }

    function showOk(message) {
      statusEl.textContent = message;
      statusEl.className = 'ok';
    }

    async function loadItems() {
      const { data, error } = await supabaseClient
        .from(TABLE)
        .select('*')
        .order('created_at', { ascending: true });
      if (error) throw error;
      return data;
    }

    function renderItems(items) {
      list.innerHTML = '';
      if (items.length === 0) {
        list.innerHTML = '<div class="empty">저장된 메모가 없습니다.</div>';
      } else {
        items.forEach((item) => {
          const li = document.createElement('li');
          const span = document.createElement('span');
          span.textContent = item.text;
          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '✕';
          delBtn.onclick = () => deleteItem(item.id);
          li.appendChild(span);
          li.appendChild(delBtn);
          list.appendChild(li);
        });
      }
      metaInfo.textContent = `총 ${items.length}개 저장됨`;
    }

    async function refresh() {
      try {
        const items = await loadItems();
        renderItems(items);
        showOk("Supabase 연결됨");
      } catch (err) {
        showError("불러오기 실패: " + err.message);
      }
    }

    async function addItem() {
      const text = input.value.trim();
      if (!text) return;
      try {
        const { error } = await supabaseClient.from(TABLE).insert({ text });
        if (error) throw error;
        input.value = '';
        await refresh();
      } catch (err) {
        showError("저장 실패: " + err.message);
      }
    }

    async function deleteItem(id) {
      try {
        const { error } = await supabaseClient.from(TABLE).delete().eq('id', id);
        if (error) throw error;
        await refresh();
      } catch (err) {
        showError("삭제 실패: " + err.message);
      }
    }

    async function clearAll() {
      try {
        const { error } = await supabaseClient.from(TABLE).delete().gt('id', 0);
        if (error) throw error;
        await refresh();
      } catch (err) {
        showError("전체 삭제 실패: " + err.message);
      }
    }

    addBtn.addEventListener('click', addItem);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addItem();
    });
    clearBtn.addEventListener('click', clearAll);

    (function init() {
      if (!window.SUPABASE_URL || !window.SUPABASE_KEY) {
        showError("config.js가 없습니다. config.example.js를 복사해 config.js를 만들고 키를 채워주세요.");
        return;
      }
      supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
      setEnabled(true);
      refresh();
    })();
  </script>
</body>
</html>
