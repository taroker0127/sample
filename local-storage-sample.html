<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Storage Sample</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg), #1e1b4b);
    color: var(--text);
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2.5rem;
    width: 420px;
    max-width: 90vw;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.6rem;
    background: linear-gradient(90deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }
  p.desc {
    color: var(--muted);
    text-align: center;
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
  }
  .input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: transform 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button.clear-btn {
    width: 100%;
    margin-top: 1rem;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 260px;
    overflow-y: auto;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(148, 163, 184, 0.08);
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
  }
  li .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    padding: 0 0.3rem;
  }
  li .del-btn:hover { color: var(--danger); }
  .empty {
    color: var(--muted);
    text-align: center;
    font-size: 0.85rem;
    padding: 1rem 0;
  }
  .meta {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>로컬 저장 메모</h1>
    <p class="desc">브라우저의 localStorage에 저장되며, 새로고침해도 유지됩니다.</p>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="메모를 입력하세요" maxlength="200">
      <button id="addBtn">추가</button>
    </div>

    <ul id="itemList"></ul>
    <div class="meta" id="metaInfo"></div>

    <button class="clear-btn" id="clearBtn">전체 삭제</button>
  </div>

  <script>
    const STORAGE_KEY = "local_storage_sample_items";

    const input = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('itemList');
    const clearBtn = document.getElementById('clearBtn');
    const metaInfo = document.getElementById('metaInfo');

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      const items = loadItems();
      list.innerHTML = '';

      if (items.length === 0) {
        list.innerHTML = '<div class="empty">저장된 메모가 없습니다.</div>';
      } else {
        items.forEach((item, index) => {
          const li = document.createElement('li');
          const span = document.createElement('span');
          span.textContent = item.text;
          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '✕';
          delBtn.onclick = () => {
            const current = loadItems();
            current.splice(index, 1);
            saveItems(current);
            render();
          };
          li.appendChild(span);
          li.appendChild(delBtn);
          list.appendChild(li);
        });
      }

      metaInfo.textContent = `총 ${items.length}개 저장됨`;
    }

    function addItem() {
      const text = input.value.trim();
      if (!text) return;
      const items = loadItems();
      items.push({ text, createdAt: new Date().toISOString() });
      saveItems(items);
      input.value = '';
      render();
    }

    addBtn.addEventListener('click', addItem);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addItem();
    });
    clearBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      render();
    });

    render();
  </script>
</body>
</html>
